version: '3.8'

services:
  sgcarmart-scraper:
    build: .
    container_name: sgcarmart-scraper
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # Persist database
      - ./data:/app/data
    environment:
      - DATABASE_URL=sqlite:///./data/scraping.db
      - SCRAPE_SCHEDULE_TIME=08:00
      - TZ=Asia/Singapore
      - PORT=3000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    labels:
      - "coolify.managed=true"
